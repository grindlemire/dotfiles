<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post Queue</title>
<style>
  /* Console look (borrowed from GitStack's ui/styles/theme.css tokens): dark panels, hairlines, IBM Plex, square pills.
     Layout: a 48px bar, then one post at a time. The queue on the left, the post's text in the middle (select it to
     comment or flag it, double-click a paragraph to edit) with the channel render under it, and its threads on the
     right, each column scrolling on its own. "All posts" lists every draft. Selection, actions, and batching follow redline. */
  @font-face { font-family: "IBM Plex Sans"; src: url(/fonts/IBMPlexSans-Regular.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "IBM Plex Sans"; src: url(/fonts/IBMPlexSans-Medium.woff2) format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "IBM Plex Sans"; src: url(/fonts/IBMPlexSans-SemiBold.woff2) format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "IBM Plex Mono"; src: url(/fonts/IBMPlexMono-Regular.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "IBM Plex Mono"; src: url(/fonts/IBMPlexMono-Medium.woff2) format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "Inter Tight"; src: url(/fonts/InterTight-SemiBold.woff2) format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "Inter Tight"; src: url(/fonts/InterTight-Bold.woff2) format("woff2"); font-weight: 700; font-display: swap; }
  :root {
    --bg0: #0e1116; --bg1: #161a21; --bg2: #1d222b; --bg3: #252a34;
    --ink95: #e8eaed; --ink80: #c8ccd2; --ink65: #9ba1ac; --ink50: #7a8090; --ink38: #5a606e; --ink22: #3a4050;
    --line: rgba(255,255,255,.06); --line-strong: rgba(255,255,255,.1);
    --blue: #5aa0ff; --blue-bg: rgba(90,160,255,.1); --add: #6ad28d; --add-bg: rgba(106,210,141,.1);
    --del: #ef6f6c; --amber: #f5b95a; --amber-bg: rgba(245,185,90,.1);
    --btn: #2b313c; --btn-hover: #343b47; --btn-border: rgba(255,255,255,.16); --on-fill: #0b0e12;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --display: "Inter Tight", "IBM Plex Sans", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg0); color: var(--ink95); font: 13px/1.5 var(--sans);
         scrollbar-color: var(--ink22) var(--bg0); }
  a { color: var(--blue); }

  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; height: 48px; display: flex; align-items: center; gap: 10px;
         padding-inline: 16px; background: var(--bg0); border-bottom: 1px solid var(--line-strong); }
  .bar img { width: 20px; height: 20px; }
  .bar .word { font: 600 15px var(--display); letter-spacing: -.01em; }
  .bar .sep { color: var(--ink38); }
  .bar .crumb { font: 500 12px var(--mono); color: var(--ink80); }
  .bar .tally { margin-left: auto; display: flex; gap: 6px; }
  .bar select { font: 500 12px var(--mono); color: var(--ink80); background: var(--bg1); border: 1px solid var(--line-strong);
                border-radius: 3px; height: 24px; }
  .label { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink50); }

  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pill { font: 500 11px/18px var(--mono); padding: 0 6px; border-radius: 3px; border: 1px solid var(--line-strong);
          color: var(--ink65); white-space: nowrap; }
  .pill.channel { color: var(--ink95); background: var(--bg3); border-color: var(--btn-border); }
  .pill.draft { color: var(--blue); background: var(--blue-bg); border-color: transparent; }
  .pill.posted { color: var(--add); background: var(--add-bg); border-color: transparent; }
  .pill.skipped { color: var(--ink50); }
  .pill.wait { color: var(--amber); background: var(--amber-bg); border-color: transparent; }
  .pill.working { display: inline-flex; align-items: center; gap: 5px; color: var(--blue); background: var(--blue-bg); border-color: transparent; }
  .spin { display: inline-block; flex: none; width: 10px; height: 10px; box-sizing: border-box; border-radius: 50%; vertical-align: -1px;
          border: 1.5px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
  .count { margin-left: auto; font: 12px var(--mono); color: var(--ink50); font-variant-numeric: tabular-nums; }
  .count.over { color: var(--del); font-weight: 500; }

  .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  button { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 4px; cursor: pointer;
           font: 500 11.5px var(--mono); color: var(--ink95); background: var(--btn); border: 1px solid var(--btn-border); }
  a.btn { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 4px; text-decoration: none;
          font: 500 11.5px var(--mono); background: var(--blue); border: 1px solid var(--blue); color: var(--on-fill); }
  a.btn:hover { filter: brightness(1.1); }
  button:hover { background: var(--btn-hover); border-color: rgba(255,255,255,.26); }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  button.primary, button.on { background: var(--blue); border-color: var(--blue); color: var(--on-fill); }
  button.on.posted { background: var(--add); border-color: var(--add); }
  button.ghost { background: transparent; border-color: transparent; color: var(--ink65); }
  button.ghost:hover { color: var(--ink95); background: var(--bg2); }

  .panel { display: grid; gap: 8px; padding: 10px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--bg2); }
  .panel label { font-size: 12px; color: var(--ink65); }
  .inline { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  textarea, input[type=text] { flex: 1; min-width: 0; font: 13px/1.5 var(--sans); color: var(--ink95); background: var(--bg0);
           border: 1px solid var(--line-strong); border-radius: 4px; padding: 6px 8px; }
  textarea { resize: vertical; min-height: 34px; }
  textarea.edit { font-size: 14px; min-height: 150px; }
  ::placeholder { color: var(--ink38); }

  .msg { display: grid; gap: 2px; }
  .msg .who { font: 500 11.5px var(--mono); color: var(--ink80); }
  .msg.claude .who { color: var(--blue); }
  .msg .at { font: 11px var(--mono); color: var(--ink38); margin-left: 6px; }
  .msg p { margin: 0; white-space: pre-wrap; color: var(--ink80); }
  .empty { color: var(--ink50); }

  /* Channel previews, drawn at each feed's real column width so lines break where they will.
     Bluesky is measured from bsky.app (dim theme, 2026-10-08). X and LinkedIn follow their feed layouts
     but couldn't be checked live (X blocks automated browsers, LinkedIn needs a login). */
  @font-face { font-family: "InterVariable"; src: url(/fonts/InterVariable.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
  .pvscroll { overflow-x: auto; }
  .pv { width: 600px; display: grid; grid-template-columns: auto minmax(0, 1fr); }
  .pv .av { border-radius: 50%; display: block; object-fit: cover; }
  .pv .head { display: flex; align-items: baseline; white-space: nowrap; overflow: hidden; min-width: 0; }
  .pv .head > * { overflow: hidden; text-overflow: ellipsis; }
  .pv .body { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .pv .card { overflow: hidden; position: relative; }
  .pv .card img { display: block; width: 100%; aspect-ratio: 1.91 / 1; object-fit: cover; }
  .pv .noimg { aspect-ratio: 1.91 / 1; display: grid; place-items: center; font-size: 12px; opacity: .6; }
  .pv .acts { display: flex; align-items: center; }
  .pv .acts svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .pv-note { font: 11px/1.5 var(--mono); color: var(--ink38); max-width: 600px; }

  /* Bluesky, dim theme. Avatar 42 at 18,9; text column 515 wide from x 70. */
  .pv.bluesky { background: #151d28; color: #fff; font-family: InterVariable, -apple-system, system-ui, sans-serif;
                border-block: 1px solid #2c3a4e; padding: 9px 15px 0 18px; column-gap: 10px; }
  .pv.bluesky .av { width: 42px; height: 42px; }
  .pv.bluesky .head { font-size: 15px; line-height: 17px; gap: 4px; }
  .pv.bluesky .name { font-weight: 600; }
  .pv.bluesky .sub { color: #abb8c9; }
  .pv.bluesky .body { margin-top: 4px; font-size: 15px; line-height: 20px; }
  .pv.bluesky .lk { color: #4d97ff; }
  .pv.bluesky .card { margin-top: 10px; border: 1px solid #2c3a4e; border-radius: 12px; }
  .pv.bluesky .cbody { border-top: 1px solid #2c3a4e; padding: 8px 12px; }
  .pv.bluesky .ct { font-weight: 600; font-size: 15px; line-height: 20px; margin-bottom: 3px;
                    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .pv.bluesky .cd { font-size: 13.1px; line-height: 17px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pv.bluesky .dom { margin-top: 7px; padding-top: 6px; border-top: 1px solid #2c3a4e; font-size: 11.3px; line-height: 15px;
                     color: #abb8c9; display: flex; align-items: center; gap: 4px; }
  .pv.bluesky .dom svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 2; }
  .pv.bluesky .acts { height: 28px; margin: 6px 0 0 -6px; color: #6f839f; }
  .pv.bluesky .acts span { width: 109px; padding: 5px; }
  .pv.bluesky .acts .r { width: 36px; padding: 5px; }
  .pv.bluesky .acts .gap { flex: 1; }

  /* X, dark ("Lights out"). 598 inside the column borders; avatar 40 + 8; text 518 wide.
     X's own font (Chirp) isn't public, so this uses the Mac system font. */
  .pv.x { background: #000; color: #e7e9ea; border: 1px solid #2f3336; padding: 12px 16px;
          font-family: TwitterChirp, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; column-gap: 8px; }
  .pv.x .av { width: 40px; height: 40px; }
  .pv.x .head { font-size: 15px; line-height: 20px; gap: 4px; }
  .pv.x .name { font-weight: 700; }
  .pv.x .sub { color: #71767b; }
  .pv.x .body { font-size: 15px; line-height: 20px; }
  .pv.x .lk { color: #1d9bf0; }
  .pv.x .card { margin-top: 12px; border: 1px solid #2f3336; border-radius: 16px; }
  .pv.x .xt { position: absolute; left: 12px; bottom: 12px; max-width: calc(100% - 24px); background: rgba(0,0,0,.77); color: #fff;
              font-size: 13px; line-height: 16px; padding: 0 4px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pv.x .from { margin-top: 4px; font-size: 13px; line-height: 16px; color: #71767b; }
  .pv.x .acts { margin-top: 12px; height: 20px; color: #71767b; justify-content: space-between; }
  .pv.x .acts svg { width: 18.75px; height: 18.75px; }
  .pv.x .acts .pair { display: flex; gap: 12px; }

  /* LinkedIn desktop feed, dark. 555 wide; text cut at 3 lines with "...more". */
  .pv.linkedin { width: 555px; background: #1b1f23; color: rgba(255,255,255,.9); border-radius: 8px; box-shadow: 0 0 0 1px rgba(140,140,140,.2);
                 font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
                 grid-template-columns: minmax(0, 1fr); }
  .pv.linkedin .top { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 8px; padding: 12px 16px 0; }
  .pv.linkedin .av { width: 48px; height: 48px; }
  .pv.linkedin .name { font-weight: 600; font-size: 14px; line-height: 20px; }
  .pv.linkedin .sub { color: rgba(255,255,255,.6); font-size: 12px; line-height: 16px; }
  .pv.linkedin .bodywrap { position: relative; margin: 8px 16px 0; }
  .pv.linkedin .body { font-size: 14px; line-height: 20px; }
  .pv.linkedin .bodywrap.clamped .body { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .pv.linkedin .more { display: none; position: absolute; right: 0; bottom: 0; padding-left: 24px; font-family: inherit; font-weight: 400; font-size: 14px; line-height: 20px; cursor: pointer;
                       color: rgba(255,255,255,.6); background: linear-gradient(to right, rgba(27,31,35,0), #1b1f23 24px); border: 0; height: auto; }
  .pv.linkedin .bodywrap.clamped.cut .more { display: block; }
  .pv.linkedin .lk { color: #71b7fb; font-weight: 600; }
  .pv.linkedin .card { margin-top: 8px; background: #38434f; }
  .pv.linkedin .cbody { padding: 8px 12px; display: grid; }
  .pv.linkedin .ct { font-weight: 600; font-size: 14px; line-height: 20px; }
  .pv.linkedin .dom { color: rgba(255,255,255,.6); font-size: 12px; line-height: 16px; }
  .pv.linkedin .acts { margin: 4px 12px 0; border-top: 1px solid rgba(255,255,255,.12); height: 48px; justify-content: space-around;
                       color: rgba(255,255,255,.6); font-size: 14px; font-weight: 600; }
  .pv.linkedin .acts span { display: inline-flex; gap: 6px; align-items: center; }
  .pv.linkedin .acts svg { width: 20px; height: 20px; }

  .pv.reddit { background: #0e1113; color: #d7dadc; border: 1px solid #343536; border-radius: 8px; padding: 12px; column-gap: 8px;
               font-family: -apple-system, system-ui, sans-serif; }
  .pv.reddit .av { width: 24px; height: 24px; }
  .pv.reddit .sub { color: #818384; font-size: 12px; }
  .pv.reddit .body { font-size: 14px; line-height: 21px; margin-top: 4px; }
  .pv.reddit .lk { color: #4fbcff; }

  :root { --green: #6ad28d; --hl-comment: rgba(245,185,90,.24); }
  html, body { height: 100%; }
  body { overflow: hidden; }
  .app { display: grid; grid-template-rows: 48px minmax(0, 1fr); height: 100%; }
  .bar .tabs { display: flex; gap: 2px; margin-left: 12px; padding: 2px; background: var(--bg1); border: 1px solid var(--line-strong); border-radius: 4px; }
  .bar .tabs button { height: 22px; border: 0; background: transparent; color: var(--ink65); }
  .bar .tabs button.on { background: var(--bg3); color: var(--ink95); }
  #view { display: grid; min-height: 0; }
  .empty { margin: 0; }

  /* Key caps sit on the text line: one cap per shortcut, centered on the words around it. */
  kbd { display: inline-flex; align-items: center; justify-content: center; height: 17px; min-width: 17px; padding: 0 4px;
        vertical-align: middle; font: 500 10.5px/1 -apple-system, system-ui, sans-serif; letter-spacing: .04em; color: var(--ink65);
        border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 3px; background: var(--bg1); }

  .focus { display: grid; grid-template-columns: 272px minmax(0, 1fr) 400px; min-height: 0; }
  .focus.norail { grid-template-columns: 0 minmax(0, 1fr) 400px; }
  .focus.noside { grid-template-columns: 272px minmax(0, 1fr) 0; }
  .focus.norail.noside { grid-template-columns: 0 minmax(0, 1fr) 0; }
  .focus.norail .rail, .focus.noside .side { visibility: hidden; }
  .rail, .stage, .side { min-height: 0; overflow: auto; }
  /* Rows keep their content's height; otherwise a full column squeezes cards that clip (overflow: hidden). */
  .rail, .stage, .side .tlist { grid-auto-rows: max-content; }

  /* Queue rail */
  .rail { border-right: 1px solid var(--line-strong); padding: 12px 8px 40px; display: grid; gap: 4px; align-content: start; }
  .rail .label { padding: 10px 8px 4px; }
  .ri { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 8px auto 1fr auto; gap: 2px 8px; align-items: center;
        padding: 7px 8px; border-radius: 4px; border: 1px solid transparent; }
  .ri:hover { background: var(--bg1); }
  .ri:focus-visible { outline: 2px solid var(--blue); }
  .ri.active { background: var(--bg2); border-color: var(--line-strong); }
  .ri .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
  .ri.posted .dot { background: var(--add); } .ri.skipped .dot { background: var(--ink38); }
  .ri .ch { font: 500 11.5px var(--mono); color: var(--ink95); }
  .ri .when { font: 11px var(--mono); color: var(--ink50); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ri .cc { font: 11px var(--mono); color: var(--ink50); display: inline-flex; gap: 6px; align-items: center; }
  .ri .cc svg, .ov-row .cc svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 2; vertical-align: -1px; margin-right: 3px; }
  .ri .cc .un { color: var(--blue); }
  .ri.wait .cc .n { color: var(--amber); }
  .ri.working .cc { color: var(--blue); }
  .ri .snip { grid-column: 2 / -1; font-size: 12px; color: var(--ink65); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ri.skipped .snip, .ri.posted .snip { color: var(--ink50); }

  /* Stage: the text first, then what to do with it, then the render */
  .stage { position: relative; padding: 20px 28px 64px; display: grid; gap: 16px; align-content: start; justify-items: center; }
  .stage > :not(.float) { width: min(100%, 680px); }
  .stagehead { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .stagehead .nav { margin-left: auto; display: flex; gap: 4px; align-items: center; font: 11.5px var(--mono); color: var(--ink50);
                    font-variant-numeric: tabular-nums; }
  .stagehead .nav button { width: 26px; justify-content: center; padding: 0; }

  .sheet { display: grid; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--bg1); }
  .sheet .shead { display: flex; align-items: center; gap: 10px; padding: 7px 10px 7px 14px; border-bottom: 1px solid var(--line); }
  .sheet .shead .count { margin-left: auto; }
  .read { padding: 14px 10px 8px; font: 16.5px/1.62 var(--sans); color: var(--ink95); cursor: text; }
  .read p { margin: 0 0 12px; padding: 2px 8px; border-radius: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .read p { transition: box-shadow 140ms ease-out, background-color 140ms ease-out; }
  .read p:hover { background: rgba(90,160,255,.035); box-shadow: inset 0 0 0 1px rgba(90,160,255,.22); }
  .read .lk { color: var(--blue); }
  /* The edit card, as in redline: the paragraph lifts into a card and its text stays exactly where it was.
     The card's surface (::before) rises under the text, and the footer opens below it, pushing what follows down. */
  .lift { position: relative; isolation: isolate; margin: 0 0 12px; padding: 2px 8px; }
  .lift::before { content: ""; position: absolute; inset: -8px -4px -4px; z-index: -1; border-radius: 8px; background: var(--bg1);
                  border: 1px solid rgba(90,160,255,.32); opacity: 0;
                  transition: opacity 160ms ease-out, transform 160ms ease-out, box-shadow 160ms ease-out; }
  .lift.lifted::before { opacity: 1; transform: translateY(-2px) scale(1.006);
                         box-shadow: 0 2px 6px rgba(0,0,0,.28), 0 14px 36px rgba(0,0,0,.42); }
  .lift textarea { display: block; width: 100%; min-height: 0; margin: 0; padding: 0; border: 0; border-radius: 0; background: transparent;
                   resize: none; overflow: hidden; field-sizing: content; font: inherit; color: inherit; caret-color: var(--blue);
                   white-space: pre-wrap; overflow-wrap: anywhere; }
  .lift textarea:focus-visible { outline: none; }
  .lift textarea::selection { background: rgba(90,160,255,.32); }
  .lift .grow-foot { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 160ms ease-out; }
  .lift.lifted .grow-foot { grid-template-rows: 1fr; }
  .lift .foot { display: flex; align-items: center; gap: 8px 10px; min-height: 0; overflow: hidden; padding-top: 12px;
                font: 11.5px var(--mono); color: var(--ink50); opacity: 0; transform: translateY(-4px);
                transition: opacity 160ms ease-out 60ms, transform 160ms ease-out 60ms; }
  .lift.lifted .foot { opacity: 1; transform: none; }
  .lift .foot .pill { color: var(--blue); background: var(--blue-bg); }
  .lift .foot .hint { display: inline-flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; }
  .lift .foot .spacer { flex: 1; }
  .lift[aria-busy="true"] .foot button { opacity: .6; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .lift::before, .lift .grow-foot, .lift .foot, .read p { transition: none; } }
  ::highlight(hl-comment) { background-color: var(--hl-comment); }
  ::highlight(hl-new) { background-color: rgba(106,210,141,.2); text-decoration: underline 1.5px rgba(106,210,141,.7); text-underline-offset: 4px; }
  .pill.revised { color: var(--add); background: var(--add-bg); border-color: transparent; }
  ::highlight(hl-pending) { background-color: rgba(90,160,255,.32); }
  ::highlight(hl-active) { text-decoration: underline 2px; text-decoration-color: var(--ink80); text-underline-offset: 4px; }
  .sheet .sfoot { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; padding: 8px 14px; border-top: 1px solid var(--line);
                  font-size: 12px; color: var(--ink50); }
  .sheet .sfoot code { font: 11.5px var(--mono); color: var(--ink80); background: var(--bg2); padding: 0 4px; border-radius: 3px; }
  .sheet .sfoot .lnk { color: var(--ink65); word-break: break-all; }
  .sheet .sfoot .how { margin-left: auto; }
  .decide { font-size: 12.5px; color: var(--ink80); padding: 8px 12px; border-radius: 4px; background: var(--amber-bg); }
  .decide b { color: var(--amber); font-weight: 500; }
  .stage .panel { max-width: 680px; }

  /* Floating selection toolbar and composer */
  .float { position: absolute; z-index: 5; }

  .card .msgs { display: grid; gap: 10px; padding: 10px 12px 12px; }

  /* Side: threads on the text in text order, then the whole-post conversation, then its composer */

            grid-template-columns: 84px 76px 110px minmax(0, 1fr) 140px 56px; padding: 9px 12px;
            background: var(--bg1); border: 1px solid var(--line-strong); border-radius: 4px; }
  .ov-row:hover { background: var(--bg2); border-color: rgba(255,255,255,.18); }

<body>
<div class="app">
<header class="bar">
  <img id="mark" alt="" hidden>
  <span class="word" id="word"></span><select id="switch" aria-label="Project" hidden></select><span class="sep">/</span><span class="crumb">post queue</span>
  <div class="tabs"><button data-view="focus">Focus</button><button data-view="all">All posts</button></div>
  <span class="tally" id="tally"></span>
</header>
<div id="view"><p class="empty" style="padding:24px 16px">Loading drafts...</p></div>
</div>
<div id="toast" class="toast" hidden></div>
<script>
const LIMITS = { x: 280, bluesky: 300, linkedin: 3000 };
const NAMES = { x: "X", bluesky: "Bluesky", linkedin: "LinkedIn", reddit: "Reddit", hn: "Hacker News" };
// Who the previews post as: ~/.config/marketer/me.json, plus the project's LinkedIn headline.
const ME = {
  avatar: "/avatar.jpg",
  bluesky: { name: "", handle: "" }, x: { name: "", handle: "" }, linkedin: { name: "", headline: "" }, reddit: { handle: "" },
};
// Which project this page shows: ?project=<slug>, or the only one in projects.toml.
let PROJECT = new URLSearchParams(location.search).get("project") || "";
const q = () => (PROJECT ? "project=" + encodeURIComponent(PROJECT) : "");

const key = (b, id) => `${b}/${id}`;
function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function postText(d, text = d.text) {
  return d.link && text.includes("{link}") ? text.replace("{link}", d.link) : text;
}
function charCount(d, text = d.text) {
  // X counts any link as 23 characters; a Bluesky link rides in a link card.
  const t = text.replace("{link}", d.channel === "x" ? "x".repeat(23) : (d.link || ""));
  return [...t].length;
}
function countHTML(d, text) {
  const n = charCount(d, text), lim = LIMITS[d.channel];

// Bluesky's composer shortens a link to host + the first 13 characters of the path, then "..."

function bodyHTML(d, text, shorten) {
  return esc(text).replace("{link}", d.link ? `<span class="lk">${esc(shorten(d.link))}</span>` : "");
}

function cardData(link) {
  if (!link) return null;
  if (og[link] === undefined) {
    og[link] = "loading";
    fetch("/api/og?" + q() + "&url=" + encodeURIComponent(link)).then(r => r.json())
      .then(j => { og[link] = j; if (typing()) deferred = true; else render(); })
      .catch(() => { og[link] = { error: "unreachable" }; });

}
const ICON = {
  reply: `<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>`,
  repost: `<svg viewBox="0 0 24 24"><path d="M7 4 4 7l3 3M4 7h13a3 3 0 0 1 3 3v2M17 20l3-3-3-3M20 17H7a3 3 0 0 1-3-3v-2"/></svg>`,
  like: `<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>`,
  views: `<svg viewBox="0 0 24 24"><path d="M5 20V12M10 20V6M15 20v-9M20 20V4"/></svg>`,
  bookmark: `<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>`,
  share: `<svg viewBox="0 0 24 24"><path d="M12 3v13M7 8l5-5 5 5M5 14v6h14v-6"/></svg>`,
  more: `<svg viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3"/></svg>`,
  globe: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>`,
  send: `<svg viewBox="0 0 24 24"><path d="M21 3 3 10l7 3 3 7z"/></svg>`,
  comment: `<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>`,
};
function linkCard(d, kind) {
  const c = cardData(d.link);
  if (!c) return `<div class="card"><div class="noimg">Loading link preview...</div></div>`;
  if (c.error) return `<div class="card"><div class="noimg">No link preview (${esc(c.error)})</div></div>`;
  const img = c.image ? `<img src="/api/ogimg?${q()}&url=${encodeURIComponent(c.image)}" alt="">` : "";
  if (kind === "x") return `<div class="card">${img}<span class="xt">${esc(c.title)}</span></div><div class="from">From ${esc(c.domain)}</div>`;
  if (kind === "linkedin") return `<div class="card">${img}<div class="cbody"><span class="ct">${esc(c.title)}</span><span class="dom">${esc(c.domain)}</span></div></div>`;
  return `<div class="card">${img}<div class="cbody"><div class="ct">${esc(c.title)}</div><div class="cd">${esc(c.description)}</div>
    <div class="dom">${ICON.globe}${esc(c.domain)}</div></div></div>`;

const NOTES = {
  bluesky: "Measured from bsky.app (dim theme). Lines break where Bluesky will break them.",
  x: "Follows X's feed layout, but X blocks automated browsers so it isn't checked live, and X's font (Chirp) isn't public. Lines can shift by a word. Open in X shows the real thing.",
  linkedin: "Follows LinkedIn's desktop feed, not checked live (needs a login). Open in LinkedIn shows the real thing.",
  reddit: "Rough sketch. Reddit varies by sub and app.",
};
function preview(d, text = d.text) {
  const ch = d.channel, av = s => `<img class="av" src="${ME.avatar}" alt="" style="width:${s}px;height:${s}px">`;
  if (ch === "bluesky") return `<div class="pv bluesky">${av(42)}<div>
      <div class="head"><span class="name">${esc(ME.bluesky.name)}</span><span class="sub">${esc(ME.bluesky.handle)}</span><span class="sub">· 1m</span></div>
      <p class="body">${bodyHTML(d, text, bskyShort)}</p>${d.link ? linkCard(d, "bluesky") : ""}

  if (ch === "x") return `<div class="pv x">${av(40)}<div>
      <div class="head"><span class="name">${esc(ME.x.name)}</span><span class="sub">${esc(ME.x.handle)}</span><span class="sub">· 1m</span></div>
      <p class="body">${bodyHTML(d, text, xShort)}</p>${d.link ? linkCard(d, "x") : ""}
      <div class="acts">${ICON.reply}${ICON.repost}${ICON.like}${ICON.views}<span class="pair">${ICON.bookmark}${ICON.share}</span></div></div></div>`;

        <div class="sub">${esc(ME.linkedin.headline)}</div><div class="sub">1m · ${ICON.globe.replace("<svg", '<svg style="width:12px;height:12px;vertical-align:-2px"')}</div></div></div>
      <div class="bodywrap clamped"><p class="body">${bodyHTML(d, text, u => u)}</p><button class="more" data-act="li-more">…more</button></div>
      ${d.link ? linkCard(d, "linkedin") : ""}

  return `<div class="pv reddit">${av(24)}<div><div class="sub">${esc(ME.reddit.handle)} · 1m</div>
      <p class="body">${bodyHTML(d, text, u => u)}</p></div></div>`;

// LinkedIn cuts a post at 3 lines; show "...more" only when it actually cut something.
function fitPreviews(root = document) {

// The real composer, filled in. Nothing posts until Joel presses Post there.
function composeURL(d) {
  const t = d.text.includes("{link}") ? postText(d) : (d.link ? d.text + "\n\n" + d.link : d.text);
  const q = encodeURIComponent(t);
  if (d.channel === "x") return `https://x.com/intent/post?text=${q}`;
  if (d.channel === "bluesky") return `https://bsky.app/intent/compose?text=${q}`;

async function copy(btn, text) {
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
  catch { btn.textContent = "Copy failed"; }
  setTimeout(() => (btn.textContent = btn.dataset.label), 1500);
}

// ---- state

let last = "", data = { batches: [] }, deferred = false;

let ACTIONS = [];       // redline's selection actions (slop, polish), from /api/actions

let active = null;      // focused thread id
let sel = null;         // {from, to} of the live text selection
let compose = null;     // {from, to, action} while the floating composer is open
let editing = null;     // {from, to} of the paragraph (or whole post) being edited
let panelOpen = null;   // "posted" | "skip" while that note is open
let showEarlier = false, showResolved = false;

const fresh = {};       // key -> {ids, text, ranges}
const unsent = {};      // "<draft key>|<textarea id>" -> typed text, kept across redraws

const all = () => data.batches.flatMap(b => (b.drafts || []).map(d => ({ b: b.batch, d, k: key(b.batch, d.id) })));

const byKey = k => all().find(x => x.k === k);
const current = () => byKey(cur);
const threads = d => d.threads || [];
const actionOf = name => ACTIONS.find(a => a.name === name);

const unsentCount = d => threads(d).filter(t => t.status === "draft").length + (d.comments || []).filter(c => c.draft).length;

// so after a few minutes without an answer it says so instead of spinning on.
const STALE_MS = 5 * 60e3;
const working = d => !!d.needs_claude && !!d.sent_at && Date.now() - d.sent_at * 1000 < STALE_MS;

const short = s => (s || "").split(",")[0].replace(/\s*\(.*\)/, "");

function day(b, d) {

const flat = () => { const q = queue(); return [...q.todo, ...q.done]; };

// ---- actions: colors and keys from redline's actions.toml

// An action's color as redline draws it on a dark page: lifted toward white.
function tone(hex) {
  const n = parseInt(String(hex || "#f5b95a").slice(1), 16);

}

// ---- server

async function api(path, body) {
  try {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ project: PROJECT, ...body }) });
    const j = await r.json();
    if (!r.ok) { toast(j.error || r.statusText, { err: true }); return null; }
    await refresh(true);

    ? `<b>Next step:</b> Claude hasn't answered on ${stuck} post${stuck > 1 ? "s" : ""}. Run <code>marketing ${esc(PROJECT)}</code> in a terminal to start a session.`

// ---- threads

// Where a thread's quote sits in the text now: where it was, else the nearest
// copy (Claude edits the JSON directly), else nowhere.
function locate(t, text) {
  const a = t.anchor;
  if (!a || t.detached) return null;
  if (text.slice(a.from, a.to) === a.quote) return a;
  let best = -1;
  for (let i = text.indexOf(a.quote); i !== -1; i = text.indexOf(a.quote, i + 1))
    if (best === -1 || Math.abs(i - a.from) < Math.abs(best - a.from)) best = i;
  return best === -1 ? null : { from: best, to: best + a.quote.length };
}
function paras(text) {
  const out = [], re = /\n{2,}/g;
  let at = 0, m;
  while ((m = re.exec(text))) { out.push([at, m.index]); at = m.index + m[0].length; }
  out.push([at, text.length]);
  return out;
}
const paraOf = (text, off) => Math.max(0, paras(text).findIndex(([, to]) => off <= to)) + 1;
function msgHTML(c, i) {
  const del = c.draft && i !== undefined ? `<button class="ghost del" data-act="del-comment" data-i="${i}">Delete</button>` : "";
  return `<div class="msg ${esc(c.who)}"><div><span class="who">${c.who === "claude" ? "claude" : "you"}</span><span class="at">${c.draft ? "unsent" : esc(c.at)}</span>${del}</div><p>${esc(c.text)}</p></div>`;
}
function card(d, t) {
  const edit = t.kind === "edit", name = edit ? "edit" : t.label || "comment";
  const label = edit ? "Edit" : t.label ? actionOf(t.label)?.label || t.label : "Comment";
  const at = edit ? null : locate(t, d.text);
  const quote = edit
    ? `<p class="quote"><del>${esc(t.edit.before)}</del> → <ins>${esc(t.edit.after)}</ins></p>`
    : `<p class="quote ${at ? "" : "gone"}">${esc(t.anchor.quote)}</p>`;
  const where = edit ? "your edit" : at ? `¶${paraOf(d.text, at.from)}` : t.status === "resolved" ? "rewritten" : "text is gone";
  const foot = {
    draft: `<span class="grow">${edit ? "Claude re-reads it with the next batch" : "unsent"}</span><button class="ghost" data-act="del" data-t="${esc(t.id)}">Delete</button>`,
    sent: working(d) ? `<span class="grow working">${SPIN} Claude is working on it</span>` : `<span class="grow">sent · no reply yet</span>`,
    resolved: `<span class="grow">resolved · reply to reopen</span>`,
    info: `<span class="grow">sent · needs no reply</span>`,
  }[t.status] || "";
  const isActive = t.id === active, rid = "reply-" + t.id;
  return `<article class="card is-${esc(t.status)} ${isActive ? "active" : ""}" ${actAttr(name)} data-t="${esc(t.id)}">
    <div class="card-head"><span class="pill act">${esc(label)}</span><span class="kind">${esc(where)}</span>
      ${t.status === "info" ? "" : `<span class="pill st-${esc(t.status)}">${esc(t.status)}</span>`}</div>
    ${quote}<div class="msgs">${(t.messages || []).map(m => msgHTML(m)).join("")}</div>
    ${isActive && !edit ? `<div class="reply"><textarea id="${rid}" placeholder="${t.status === "draft" ? "Add to this comment" : "Reply (reopens it for the next batch)"}">${esc(unsent[cur + "|" + rid] || "")}</textarea></div>` : ""}
    <div class="foot">${foot}</div></article>`;
}
function postCard(d) {
  const cs = d.comments || [];
  if (!cs.length) return "";
  const hidden = showEarlier ? 0 : Math.max(0, cs.length - 3);
  return `<span class="label">Whole post</span>
    <article class="card" data-action="comment"><div class="card-head"><span class="pill">Post</span><span class="kind">${cs.length} message${cs.length > 1 ? "s" : ""}</span></div>
    <div class="msgs">${hidden ? `<button class="ghost more" data-act="earlier">Show ${hidden} earlier</button>` : ""}${cs.slice(hidden).map((c, i) => msgHTML(c, hidden + i)).join("")}</div></article>`;
}
function workPill(d) {
  if (working(d)) return `<span class="pill working" title="You sent a batch; Claude's answers show up here as they come in">${SPIN}Claude is working</span>`;
  if (stalled(d)) return `<span class="pill wait" title="Run marketing ${esc(PROJECT)} in a terminal to start a session">no reply yet</span>`;
  return "";
}
function sideHTML(d) {
  const ts = threads(d), pos = t => locate(t, d.text)?.from ?? 1e9;
  const open = ts.filter(t => t.kind === "text" && t.status !== "resolved").sort((a, b) => pos(a) - pos(b));
  const edits = ts.filter(t => t.kind === "edit" && t.status === "draft");
  // Threads Claude answered in the latest round stay in view until the next Send batch.
  const answered = ts.filter(t => t.kind === "text" && t.status === "resolved" && t.sent_in === d.sends).sort((a, b) => pos(a) - pos(b));
  const done = ts.filter(t => (t.kind === "text" && t.status === "resolved" && !answered.includes(t)) || (t.kind === "edit" && t.status !== "draft"));
  const u = unsentCount(d), slop = ACTIONS.find(a => a.name === "slop");

  return `<aside class="side">
    <div class="head"><span class="label">Threads</span>${workPill(d)}<span class="grow"></span>
      <button class="${u ? "primary" : ""}" data-act="send" ${u ? "" : "disabled"} title="Send everything unsent on this post to Claude">Send batch${u ? ` (${u})` : ""}</button></div>
    <div class="tlist" id="tlist">
      ${open.length ? `<span class="label">On the text</span>${open.map(t => card(d, t)).join("")}` : answered.length ? "" : `<p class="empty">${hint}</p>`}
      ${answered.length ? `<span class="label">Claude answered</span>${answered.map(t => card(d, t)).join("")}` : ""}

    </div>
    <form class="compose"><textarea id="comment" aria-label="Comment on the whole post" placeholder="Comment on the whole post">${esc(unsent[cur + "|comment"] || "")}</textarea>
      <div class="inline"><span class="hint"><kbd>⌘↵</kbd> to add · joins the batch</span><button>Add</button></div></form>
  </aside>`;
}

// ---- the readable text: paragraphs of text nodes, indexed so a DOM selection maps to offsets in d.text

let IDX = [];  // [{node, start}] for every text node, in order
function buildRead() {
  const el = document.getElementById("read");
  if (!el) return;
  const d = current().d, text = d.text;
  IDX = []; el.replaceChildren();
  if (editing && editing.from === 0 && editing.to === text.length) { el.append(editBox(text)); return; }
  for (const [from, to] of paras(text)) {
    if (editing && editing.from === from && editing.to === to) { el.append(editBox(text.slice(from, to))); continue; }
    const p = document.createElement("p");
    p.dataset.from = from; p.dataset.to = to;
    let at = 0;
    for (const part of text.slice(from, to).split(/(\{link\})/)) {
      if (!part) continue;
      const node = document.createTextNode(part);
      if (part === "{link}") { const s = document.createElement("span"); s.className = "lk"; s.title = d.link || ""; s.append(node); p.append(s); }
      else p.append(node);
      IDX.push({ node, start: from + at });
      at += part.length;
    }
    el.append(p);
  }
}
function editBox(value) {
  const card = document.createElement("div"), whole = editing.from === 0 && editing.to === current().d.text.length;
  card.className = "lift";
  card.innerHTML = `<textarea id="editbox" rows="1" spellcheck="true" aria-label="Edit text"></textarea>
    <div class="grow-foot"><div class="foot">
      <span class="pill">${whole ? "whole post" : "¶" + paraOf(current().d.text, editing.from)}</span>
      <span class="hint"><span><kbd>⌘↵</kbd> save</span><span><kbd>esc</kbd> done</span></span>
      <span class="spacer"></span>
      <button class="ghost" data-act="edit-cancel" title="Close without saving">Cancel</button>
      <button class="primary" data-act="edit-save" title="Save · Claude reads it with the next batch">Save</button>
    </div></div>`;
  card.querySelector("textarea").value = unsent[cur + "|editbox"] ?? value;
  return card;
}
function offsetOf(node, off) {
  const hit = IDX.find(x => x.node === node);
  if (hit) return hit.start + off;
  // An element boundary: the text node at or after that child.
  const kid = node.childNodes[off];
  const first = kid && IDX.find(x => kid === x.node || kid.contains(x.node));
  if (first) return first.start;
  const before = IDX.filter(x => node.contains(x.node)).pop();
  return before ? before.start + before.node.length : null;
}
function rangeFor(from, to) {
  const at = (o, end) => {
    const x = IDX.find(x => (end ? o > x.start : o >= x.start) && o <= x.start + x.node.length) || IDX.find(x => x.start >= o);
    return x ? [x.node, Math.max(0, Math.min(x.node.length, o - x.start))] : null;
  };
  const a = at(from, false), b = at(to, true);
  if (!a || !b) return null;
  const r = document.createRange(); r.setStart(...a); r.setEnd(...b);
  return r;
}
// Highlights use the CSS Custom Highlight API, so the text's DOM stays plain.
function paint() {
  if (!window.Highlight || !CSS.highlights) return;
  CSS.highlights.clear();
  const x = view === "focus" && current();
  if (!x) return;
  const groups = {};
  for (const t of threads(x.d)) {
    if (t.kind !== "text" || t.status === "resolved") continue;
    const at = locate(t, x.d.text), r = at && rangeFor(at.from, at.to);
    if (!r) continue;
    const g = "hl-" + (actionOf(t.label) ? t.label : "comment");
    (groups[g] ||= []).push(r);
    if (t.id === active) CSS.highlights.set("hl-active", new Highlight(r));
  }
  for (const [g, rs] of Object.entries(groups)) CSS.highlights.set(g, new Highlight(...rs));
  const f = fresh[cur];
  if (f && f.text === x.d.text) CSS.highlights.set("hl-new", new Highlight(...f.ranges.map(([a, b]) => rangeFor(a, b)).filter(Boolean)));
  if (compose) { const r = rangeFor(compose.from, compose.to); if (r) CSS.highlights.set("hl-pending", new Highlight(r)); }
}

// ---- selection toolbar and composer, as in redline

function updateSelection() {
  const bar = document.getElementById("selbar"), read = document.getElementById("read");
  if (!bar) return;
  const s = document.getSelection();
  if (compose || editing || !s || s.isCollapsed || !s.rangeCount || !read.contains(s.getRangeAt(0).commonAncestorContainer)) {
    bar.hidden = true; sel = null; catchUp(); return;
  }
  const r = s.getRangeAt(0), text = current().d.text;
  let from = offsetOf(r.startContainer, r.startOffset), to = offsetOf(r.endContainer, r.endOffset);
  if (from == null || to == null) return;
  // Drop the whitespace a triple-click or drag picks up.
  while (from < to && /\s/.test(text[from])) from++;
  while (to > from && /\s/.test(text[to - 1])) to--;
  if (to <= from) { bar.hidden = true; sel = null; return; }
  sel = { from, to };
  bar.hidden = false;
  place(bar, r.getClientRects()[0] || r.getBoundingClientRect(), "above");
}
// place floats el in the stage just above (or below) a rect, kept inside the column.
function place(el, rect, where) {
  const stage = document.querySelector(".stage"), sr = stage.getBoundingClientRect();
  const top = where === "above" && rect.top - sr.top > 44
    ? rect.top - sr.top + stage.scrollTop - el.offsetHeight - 8
    : rect.bottom - sr.top + stage.scrollTop + 8;
  el.style.top = top + "px";
  el.style.left = Math.max(8, Math.min(rect.left - sr.left, stage.clientWidth - el.offsetWidth - 8)) + "px";
}
function openComposer(action) {
  if (!sel) return;
  compose = { ...sel, action };
  const a = actionOf(action), text = current().d.text, r = rangeFor(sel.from, sel.to);
  document.getSelection().removeAllRanges();
  document.getElementById("selbar").hidden = true;
  const el = document.getElementById("composer");
  el.innerHTML = `<div class="composer" ${actAttr(action || "comment")}>
    <div class="card-head">${a ? `<span class="pill act">${esc(a.label)}</span>` : `<span class="pill new">New</span>`}<span class="kind">¶${paraOf(text, compose.from)}</span></div>
    <p class="quote">${esc(text.slice(compose.from, compose.to))}</p>
    <textarea id="cbox" class="${a ? "short" : ""}" placeholder="${a ? (a.note === "required" ? "Add a note" : "Add a note (optional)") : "Leave a comment"}" aria-label="${a ? "Note" : "Comment"}"></textarea>
    <div class="row"><span class="hint">${a ? "<kbd>↵</kbd> add" : "<kbd>⌘↵</kbd> add"} · <kbd>esc</kbd> cancel</span>
      <button class="ghost" data-act="c-cancel">Cancel</button><button class="primary" data-act="c-add">Add</button></div></div>`;
  el.hidden = false;
  if (r) place(el, [...r.getClientRects()].pop() || r.getBoundingClientRect(), "below");
  paint();
  document.getElementById("cbox").focus();
}
function closeComposer() {
  compose = null;
  const el = document.getElementById("composer"); if (el) el.hidden = true;
  paint(); catchUp();
}
async function addThread(from, to, label, text) {
  const d = current().d;
  const j = await api("/api/thread", { ...target(), label, text, anchor: { quote: d.text.slice(from, to), from, to } });
  if (j) { active = j.thread; render(); flashCard(j.thread); }
  return j;
}
async function submitComposer() {
  const c = compose, note = document.getElementById("cbox").value.trim(), a = actionOf(c.action);
  if (!a && !note) return;
  if (a && a.note === "required" && !note) return;
  closeComposer();
  await addThread(c.from, c.to, c.action, note);
}
// An action's key flags the selection at once, skipping an optional note.
async function quickAction(a) {
  if (a.note === "required") return openComposer(a.name);
  const s = sel;
  document.getSelection().removeAllRanges(); sel = null;
  const j = await addThread(s.from, s.to, a.name, "");
  if (j) toast(`Flagged as ${a.label.toLowerCase()}. It goes to Claude with the next batch.`, { action: a.name, undo: j.thread });
}
function flashCard(id) {
  const c = document.querySelector(`.side .card[data-t="${CSS.escape(id)}"]`);
  if (c) { c.scrollIntoView({ block: "nearest" }); c.classList.add("flash"); }
}
let toastTimer;
function toast(msg, { err, action, undo } = {}) {
  const el = document.getElementById("toast");
  el.className = "toast" + (err ? " err" : "");
  el.innerHTML = `${action ? `<span class="sw" ${actAttr(action)}></span>` : ""}<span>${esc(msg)}</span>${undo ? `<button class="ghost" data-act="undo" data-t="${esc(undo)}">Undo</button>` : ""}`;
  el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), err ? 7000 : 4000);
}

// ---- editing a paragraph, or the whole post, in place

// Only #read is rebuilt, never the whole view, so nothing around the paragraph moves or scrolls.
const LIFT_MS = 160;
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const settle = () => new Promise(r => setTimeout(r, reduced() ? 0 : LIFT_MS));
// pick: the text range selected when the edit opened (a double-click selects a word), kept in the box.
function startEdit(from, to, pick) {
  if (editing) return;
  stash(); delete unsent[cur + "|editbox"];
  closeComposer();
  editing = { from, to, before: current().d.text.slice(from, to) };
  openCard(pick ? [pick.from - from, pick.to - from] : null);
}
function openCard(range) {
  buildRead(); paint();
  const ta = document.getElementById("editbox"), card = ta.closest(".lift");
  grow(ta);
  ta.focus({ preventScroll: true });
  const end = ta.value.length;
  ta.setSelectionRange(...(range && range[0] >= 0 && range[1] <= end ? range : [end, end]));
  void card.offsetWidth; // flush the resting state so the lift animates
  card.classList.add("lifted");
}
// Save (or, unchanged, just close): the card settles back into the page, then the new text takes its place.
async function commitEdit(cancel) {
  if (!editing || editing.closing) return;
  const ta = document.getElementById("editbox"), e = editing, card = ta?.closest(".lift");
  // Clicking another post saves this one: hold on to which post it is across the settle.
  const after = ta ? ta.value : e.before, where = target(), k = cur;
  e.closing = true;
  card?.classList.remove("lifted");
  card?.setAttribute("aria-busy", "true");
  ta?.blur();
  await settle();
  if (editing === e) editing = null;
  delete unsent[k + "|editbox"];
  if (cancel || after === e.before) { if (k === cur) { buildRead(); paint(); } return catchUp(); }
  if (await api("/api/edit", { ...where, from: e.from, to: e.to, before: e.before, text: after }) || k !== cur) return;
  // On a conflict the card opens again with Joel's text in it.
  editing = { from: e.from, to: e.to, before: e.before }; unsent[k + "|editbox"] = after;
  openCard(null);
}
// field-sizing: content sizes the box as it's typed in; elsewhere, measure it without letting it collapse first,
// which would shrink the column and scroll it.
function grow(ta) {
  if (CSS.supports("field-sizing", "content")) return;
  const card = ta.closest(".lift");
  card.style.minHeight = card.offsetHeight + "px";
  ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px";
  card.style.minHeight = "";
}
function livePreview() {
  const ta = document.getElementById("editbox"), d = current().d, slot = document.querySelector(".pvslot");
  if (!ta) return;
  const text = d.text.slice(0, editing.from) + ta.value + d.text.slice(editing.to);
  document.querySelector(".shead .count").outerHTML = countHTML(d, text);
  if (slot) { slot.innerHTML = preview(d, text); fitPreviews(slot); }
}

// ---- render

function stash() {
  document.querySelectorAll("#comment, #editbox, [id^=reply-]").forEach(t => { unsent[cur + "|" + t.id] = t.value; });
}
// Shrink the render to fit the column, so it never forces a sideways scroll.
function fitRender() {
  const box = document.querySelector(".pvfit");
  if (!box) return;
  box.querySelector(".pvslot").style.zoom = Math.min(1, box.clientWidth / box.querySelector(".pv").offsetWidth);
  fitPreviews(box);
}
function render() {
  stash();
  deferred = false;
  const items = all(), n = s => items.filter(x => st(x.d) === s).length;
  const busyN = items.filter(x => working(x.d)).length, stuck = items.filter(x => stalled(x.d)).length;
  lastWork = workSig();
  document.getElementById("tally").innerHTML = `<span class="pill draft">${n("draft")} to review</span><span class="pill posted">${n("posted")} posted</span>` +
    (busyN ? `<span class="pill working">${SPIN}Claude is working on ${busyN}</span>` : "") +
    (stuck ? `<span class="pill wait">${stuck} with no reply yet</span>` : "");
  document.querySelectorAll(".tabs button").forEach(t => t.classList.toggle("on", t.dataset.view === view));
  const scroll = [document.querySelector(".stage")?.scrollTop, document.getElementById("tlist")?.scrollTop];
  document.getElementById("view").innerHTML = view === "all" ? overview() : focusView();
  if (document.querySelector(".stage")) {
    // Fill the text in before putting the scroll back: an empty #read is shorter, and the scroll would clamp to it.
    buildRead(); fitRender();
    document.querySelector(".stage").scrollTop = scroll[0] || 0;
    document.getElementById("tlist").scrollTop = scroll[1] || 0;
    const ta = document.getElementById("editbox");
    if (ta) { grow(ta); ta.closest(".lift").classList.toggle("lifted", !editing.closing); }
    const panel = document.querySelector(".stage .panel input"); if (panel) panel.focus();
  }
  paint();
  const f = view === "focus" && fresh[cur];
  if (f?.ids.length) { for (const id of f.ids) document.querySelector(`.side .card[data-t="${CSS.escape(id)}"]`)?.classList.add("flash"); f.ids = []; }
}
addEventListener("resize", fitRender);

function go(v, k) {
  stash();
  view = v;
  if (k && k !== cur) { delete fresh[cur]; cur = k; active = null; editing = null; compose = null; panelOpen = null; showEarlier = false; showResolved = false; }
  const x = current();
  try { history.replaceState(null, "", location.search + "#" + (v === "all" ? "all" : x ? x.d.id : "")); } catch {}
  render();
  if (v === "focus") document.querySelector(".stage")?.scrollTo(0, 0);
}
function step(n) {
  const list = flat(), i = list.findIndex(x => x.k === cur);
  go("focus", list[Math.max(0, Math.min(list.length - 1, i + n))].k);
}
// After Posted or Skip, move on to the next post still to review.
function advance() {
  const next = queue().todo[0];
  if (next) go("focus", next.k); else go("all");
}

// Don't redraw under someone mid-sentence, mid-selection, or mid-edit; catch up when they're done.
function typing() {
  const a = document.activeElement;
  return a && a.matches("textarea, input[type=text]") && a.value.trim() !== "";
}
const busy = () => typing() || compose || editing || sel;
function catchUp() { if (deferred && !busy()) render(); }
// Claude's messages on each post, so a poll can tell when it answered.
function said(dat) {
  const m = {};
  for (const b of dat.batches || []) for (const d of b.drafts || []) {
    const ids = threads(d).filter(t => t.messages?.at(-1)?.who === "claude").map(t => t.id);
    const n = threads(d).reduce((n, t) => n + (t.messages || []).filter(x => x.who === "claude").length, 0)
      + (d.comments || []).filter(c => c.who === "claude").length;
    m[key(b.batch, d.id)] = { n, ids, text: d.text, base: d.sent_text };
  }
  return m;
}
function spotAnswers(was) {
  const before = said(was), now = said(data), hits = [];
  for (const [k, x] of Object.entries(now)) {
    const b = before[k];
    if (!b || x.n <= b.n) continue;
    const ids = x.ids.filter(id => !b.ids.includes(id));
    // Claude rewrites the text and then answers thread by thread, maybe across polls: mark against the
    // text as it was sent, not as the last poll saw it.
    const base = x.base ?? b.text;
    fresh[k] = { ids, text: x.text, ranges: base === x.text ? [] : changed(base, x.text) };
    hits.push(k);
  }
  if (!hits.length) return;
  const x = byKey(hits[0]), n = fresh[hits[0]].ids.length, revised = fresh[hits[0]].ranges.length;
  toast(hits.length > 1 ? `Claude answered on ${hits.length} posts.`
    : hits[0] !== cur || view !== "focus" ? `Claude answered on ${NAMES[x.d.channel] || x.d.channel} ${short(x.d.post_on)}.`
    : `Claude answered${n ? ` ${n} comment${n > 1 ? "s" : ""}` : ""}${revised ? " and revised the post (marked in green)" : ""}.`);
}
// The stretches of now that aren't in old, by a word-level LCS (posts are short).
function changed(old, now) {
  const tok = t => t.match(/\s+|\S+/g) || [], a = tok(old), b = tok(now), n = a.length, m = b.length;
  if (n * m > 4e6) return [];
  const L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = [];
  for (let i = 0, j = 0, at = 0; j < m; ) {
    if (i < n && a[i] === b[j]) { at += b[j++].length; i++; continue; }
    if (i < n && L[i + 1][j] >= L[i][j + 1]) { i++; continue; }
    const end = at + b[j++].length, prev = out.at(-1);
    // One mark across a run of new words, spaces between them included.
    if (prev && !now.slice(prev[1], at).trim()) prev[1] = end; else out.push([at, end]);
    at = end;
  }
  return out.filter(([f, t]) => now.slice(f, t).trim()).map(([f, t]) => {
    while (/\s/.test(now[f])) f++;
    while (/\s/.test(now[t - 1])) t--;
    return [f, t];
  });
}
let lastWork = "";
const workSig = () => all().map(x => working(x.d) ? "w" : stalled(x.d) ? "s" : "").join("");
async function refresh(force) {
  try {
    const txt = await (await fetch("/api/drafts?" + q())).text();
    if (!force && txt === last && workSig() === lastWork) return;
    last = txt;
    const was = data; data = JSON.parse(txt);
    if (was.batches.length) spotAnswers(was);
    if (data.error) { document.getElementById("view").innerHTML = `<p class="empty" style="padding:24px 16px">${esc(data.error)}</p>`; return; }
    if (!PROJECT) PROJECT = data.project;
    if (busy() && !force) { deferred = true; return; }
    render();
  } catch { /* server restarting; try again next tick */ }
}
document.addEventListener("focusout", () => setTimeout(catchUp, 0));

function threadAt(x, y) {
  const pos = document.caretPositionFromPoint?.(x, y), rng = !pos && document.caretRangeFromPoint?.(x, y);
  const o = pos ? offsetOf(pos.offsetNode, pos.offset) : rng ? offsetOf(rng.startContainer, rng.startOffset) : null;
  if (o == null) return null;
  const d = current().d;
  return threads(d).map(t => ({ t, at: t.kind === "text" && t.status !== "resolved" && locate(t, d.text) }))
    .filter(({ at }) => at && at.from <= o && o < at.to)
    .sort((a, b) => (a.at.to - a.at.from) - (b.at.to - b.at.from))[0]?.t;
}
function focusThread(id, scrollText) {
  stash(); active = id; render(); flashCard(id);
  const d = current().d, t = threads(d).find(t => t.id === id), at = t && t.kind === "text" && locate(t, d.text);
  if (scrollText && at) rangeFor(at.from, at.to)?.startContainer.parentElement.scrollIntoView({ block: "center", behavior: "smooth" });
}

// ---- events

document.addEventListener("selectionchange", () => requestAnimationFrame(updateSelection));
document.addEventListener("mousedown", e => {
  // Keep the text selection when pressing a toolbar button.
  if (e.target.closest("#selbar")) e.preventDefault();
  else if (compose && !e.target.closest("#composer")) closeComposer();
  if (editing && !e.target.closest(".lift")) commitEdit(false);
});
document.addEventListener("mouseup", e => {
  if (!e.target.closest("#read") || !document.getSelection().isCollapsed) return;
  const t = threadAt(e.clientX, e.clientY);
  if (t) focusThread(t.id, false);
});
document.addEventListener("dblclick", e => {
  const p = e.target.closest("#read p[data-from]");
  if (!p) return;
  // Keep the word the double-click selected selected in the box.
  const s = document.getSelection(), r = s.rangeCount && s.getRangeAt(0);
  const pick = r && { from: offsetOf(r.startContainer, r.startOffset), to: offsetOf(r.endContainer, r.endOffset) };
  s.removeAllRanges(); sel = null;
  startEdit(+p.dataset.from, +p.dataset.to, pick && pick.from != null && pick.to != null ? pick : null);
});
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-go],[data-view],[data-filter],button[data-act],.side .card[data-t]");
  if (!t) return;
  if (t.dataset.go) return go("focus", t.dataset.go);
  if (t.dataset.view) return go(t.dataset.view);
  if (t.dataset.filter) { filter = t.dataset.filter; return render(); }
  if (!t.dataset.act) { if (t.dataset.t !== active && !e.target.closest("textarea")) focusThread(t.dataset.t, true); return; }
  e.stopPropagation();
  const x = current(), d = x?.d;
  const val = id => (document.getElementById(id)?.value ?? "").trim();
  switch (t.dataset.act) {
    case "li-more": return t.closest(".bodywrap").classList.remove("clamped");
    case "rail": rail = !rail; return render();
    case "prev": return step(-1);
    case "next": return step(1);
    case "copy": return copy(t, postText(d));
    case "copylink": return copy(t, d.link);
    case "pv": showPreview = !showPreview; try { localStorage.setItem("pv", showPreview ? "1" : "0"); } catch {} return render();
    case "edit-all": return startEdit(0, d.text.length);
    case "edit-save": return commitEdit(false);
    case "edit-cancel": return commitEdit(true);
    case "posted": case "skip": panelOpen = panelOpen === t.dataset.act ? null : t.dataset.act; return render();
    case "close": panelOpen = null; return render();
    case "save-skip": if (await api("/api/status", { ...target(), status: "skipped", reason: val("skipnote") })) { panelOpen = null; advance(); } return;
    case "save-posted": if (await api("/api/status", { ...target(), status: "posted", url: val("posturl") })) { panelOpen = null; advance(); } return;
    case "draft": return api("/api/status", { ...target(), status: "draft" });
    case "sel-comment": return openComposer(null);
    case "sel-action": { const a = actionOf(t.dataset.a); return a.note === "none" ? quickAction(a) : openComposer(a.name); }
    case "c-add": return submitComposer();
    case "c-cancel": return closeComposer();
    case "del": return api("/api/delete", { ...target(), thread: t.dataset.t });
    case "undo": document.getElementById("toast").hidden = true; return api("/api/delete", { ...target(), thread: t.dataset.t });
    case "del-comment": return api("/api/delete", { ...target(), comment: +t.dataset.i });
    case "earlier": showEarlier = true; return render();
    case "resolved": showResolved = !showResolved; return render();
    case "send": {
      const n = unsentCount(d);
      t.disabled = true; t.innerHTML = `${SPIN} Sending`;
      if (await api("/api/send", target())) toast(`Sent ${n} to Claude.`); else render();
      return;
    }
  }
});
document.addEventListener("input", e => { if (e.target.id === "editbox") { grow(e.target); livePreview(); } });
async function addPostComment() {
  const ta = document.getElementById("comment"), text = ta.value.trim();
  if (!text) return;
  ta.value = ""; delete unsent[cur + "|comment"];
  if (await api("/api/comment", { ...target(), text })) { const l = document.getElementById("tlist"); l.scrollTop = l.scrollHeight; }
  else ta.value = text;
}
async function addReply(ta) {
  const text = ta.value.trim(), thread = ta.id.slice("reply-".length);
  if (!text) return;
  ta.value = ""; delete unsent[cur + "|" + ta.id];
  if (!(await api("/api/reply", { ...target(), thread, text }))) ta.value = text;
}
document.addEventListener("submit", e => { e.preventDefault(); addPostComment(); });
document.addEventListener("keydown", e => {
  const mod = e.metaKey || e.ctrlKey, t = e.target;
  const a = view === "focus" && ACTIONS.find(a => keyMatches(e, parseKey(a.key)));
  if (a && !compose && !editing) { updateSelection(); if (sel) { e.preventDefault(); quickAction(a); } return; }
  if (t.id === "cbox") {
    // An action's note is short: Enter adds it (Shift+Enter for a new line).
    if (e.key === "Enter" && (mod || (compose?.action && !e.shiftKey))) { e.preventDefault(); submitComposer(); }
    else if (e.key === "Escape") { e.preventDefault(); closeComposer(); }
    return;
  }
  if (t.id === "editbox") {
    // Esc finishes the edit as clicking away does, saving what was typed; Cancel drops it.
    if ((e.key === "Enter" && mod) || e.key === "Escape") { e.preventDefault(); commitEdit(false); }
    return;
  }
  if (t.matches("textarea, input")) {
    if (e.key === "Enter" && mod && t.matches("textarea")) { e.preventDefault(); t.id === "comment" ? addPostComment() : addReply(t); }
    if (e.key === "Enter" && t.id === "skipnote") document.querySelector('[data-act="save-skip"]').click();
    if (e.key === "Enter" && t.id === "posturl") document.querySelector('[data-act="save-posted"]').click();
    if (e.key === "Escape") t.blur();
    return;
  }
  if (mod || e.altKey) return;
  if (view === "focus") {
    if (e.key === "Escape") {
      if (sel) { document.getSelection().removeAllRanges(); return; }
      if (active) { active = null; return render(); }
      return go("all");
    }
    if (e.key === "c") { e.preventDefault(); updateSelection(); return sel ? openComposer(null) : document.getElementById("comment")?.focus(); }
    if (e.key === "j") step(1);
    else if (e.key === "k") step(-1);
    else if (e.key === "[") { rail = !rail; render(); }
    else if (e.key === "]") { side = !side; render(); }
    else if (e.key === "p") document.querySelector('[data-act="pv"]')?.click();
    else if (e.key === "e" && current()) { e.preventDefault(); startEdit(0, current().d.text.length); }
    else if (e.key === "a") go("all");
  } else if (e.key === "f" || e.key === "Escape") go("focus");
});

async function setup() {
  try {
    const [me, list, acts] = await Promise.all(["/api/me", "/api/projects", "/api/actions"].map(u => fetch(u).then(r => r.json())));
    for (const ch of ["bluesky", "x", "linkedin", "reddit"]) Object.assign(ME[ch], me[ch] || {});
    ACTIONS = acts.actions || [];
    actionStyles();
    const projects = list.projects || [];
    if (!PROJECT && projects.length === 1) PROJECT = projects[0].slug;
    const p = projects.find(x => x.slug === PROJECT);
    if (p) {
      ME.linkedin.headline = p.headline || ME.linkedin.headline;
      document.title = `${p.name} Post Queue`;
      document.getElementById("word").textContent = p.name.toLowerCase();
      if (p.mark) { const m = document.getElementById("mark"); m.src = "/mark.svg?" + q(); m.hidden = false; }
    }
    if (projects.length > 1) {
      const sw = document.getElementById("switch");
      sw.innerHTML = projects.map(x => `<option value="${esc(x.slug)}"${x.slug === PROJECT ? " selected" : ""}>${esc(x.name)}</option>`).join("");
      sw.hidden = false;
      document.getElementById("word").hidden = true;
      sw.addEventListener("change", () => { location.search = "?project=" + encodeURIComponent(sw.value); });
    }
  } catch { /* previews fall back to blank names */ }
  await refresh(true);
  // Open the post named in the address (#<draft id>), or the overview (#all).
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === "all") view = "all";
  else if (h) { const x = all().find(x => x.d.id === h); if (x) cur = x.k; }
  render();
  setInterval(refresh, 2000);
}
setup();
</script>
